server {
    listen 80;
    server_name inogi.pl www.inogi.pl _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    set $HSTS "max-age=63072000; includeSubDomains; preload";
    set $CSP "default-src 'self'; script-src 'self' 'unsafe-inline' https://umami.inogi.pl; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data: https:; connect-src 'self' https://umami.inogi.pl; frame-ancestors 'none'; base-uri 'self'; form-action 'self' mailto:; object-src 'none'; upgrade-insecure-requests;";
    set $PERMISSIONS "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=(), interest-cohort=()";

    add_header Strict-Transport-Security $HSTS always;
    add_header Content-Security-Policy $CSP always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy $PERMISSIONS always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/woff2;

    location ^~ /_astro/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Strict-Transport-Security $HSTS always;
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
    }

    location ~* \.(woff2|woff|ttf|otf|svg|jpg|jpeg|png|webp|avif|ico|txt)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, stale-while-revalidate=86400" always;
        add_header Strict-Transport-Security $HSTS always;
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
    }

    location / {
        try_files $uri $uri/ /index.html =404;
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        add_header Strict-Transport-Security $HSTS always;
        add_header Content-Security-Policy $CSP always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy $PERMISSIONS always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
    }
}